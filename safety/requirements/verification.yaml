  # ============================================================================
  # REQ-1 / REQ-6 — trap_gate must be ON THE RUNTIME PATH (issue #288)
  #
  # The systemic trap-equivalence gate (trap_gate, issue #279/#284) had ZERO
  # callers — its transform-checking entry points were dead code, so trap
  # soundness rested entirely on the per-fold STATIC guards. UCA-5 (ISLE folds
  # a trapping op to a constant, suppressing the trap; mitigated by CC-4) and
  # UCA-21 (Z3 encoding omits the trap condition; mitigated by CC-20) both
  # describe exactly the failure the dead gate was meant to catch. #288 wires
  # the gate onto the constant_folding runtime path as an additive proof
  # BACKSTOP: for every div/rem-on-constants fold that FIRES, ordeal must prove
  # the op was trap-free (certificate re-checked) or the fold is reverted. This
  # test fails if the gate is not on the runtime path (observability +
  # accept/block assertions), which is the whole point of #288.
  # ============================================================================

  - id: TEST-TRAP-GATE-RUNTIME-PATH
    type: feature
    title: trap_gate wired onto the constant-folding runtime path (#288 backstop)
    description: >
      Verifies that the trap-equivalence gate (trap_gate) is actually
      INVOKED by the constant_folding pass — not dead code (#288). The
      backstop (loom_core::trap_backstop) is consulted for every div/rem →
      constant fold that fires: a known-safe fold (20/4) is observed AND
      accepted by ordeal; a constructed trapping fold (div_s(INT_MIN,-1),
      div_u(x,0)) is BLOCKED, with the static guard bypassed in-test so the
      gate — not the static guard — is proven to be the runtime authority.
      Additive only: no static guard is relaxed. Mitigates UCA-5 (CC-4) and
      UCA-21 (CC-20). rem_s is a documented gap (ordeal over-approximates its
      overflow trap); it stays on its exact static #273 guard. Runs under the
      `verification` feature (default), which pulls in ordeal + Z3.
    fields:
      method: automated-test
      steps:
        - run: |
            cargo test --release --lib -p loom-core --features verification -- test_288_ trap_gate::tests::div_discard trap_gate::tests::rem
    status: verified
    release: v1.3.0
    tags: [v122, verification, trap-gate, safety]
    links:
      - type: verifies
        target: REQ-1
      - type: verifies
        target: REQ-6
      - type: mitigates
        target: UCA-5
      - type: mitigates
        target: UCA-21
      - type: verifies
        target: CC-4
      - type: verifies
        target: CC-20

  # ============================================================================
  # #231 — proof-carrying facts. loom does not discard the invariants its
  # validator discharges: it emits them for the downstream AOT compiler, which
  # re-proves its own specialization UNDER the fact rather than trusting it.
  # Two properties are load-bearing and both are asserted here: facts are
  # attached to VALUES (an index-keyed fact is silently re-pointed by the next
  # renumbering pass), and loom OWNS the `wsc.*` namespace on input (an
  # inherited or forged section must never be re-emitted as though loom had
  # proved it).
  # ============================================================================

  - id: TEST-WSC-FACTS-EMITTER
    type: feature
    title: proof-carrying wsc.facts emitter + wsc.* trust boundary (#231 P1)
    description: >
      Verifies the producer side of the wsc.facts channel. Golden-bytes: the
      schema-v1 value-range encoding is asserted byte-for-byte against the
      consumer's frozen wire format, so producer and consumer cannot drift.
      Drop-safety: a fact whose value_id is out of range for the final body, or
      which names an imported/nonexistent function, is DROPPED — never emitted
      against a different operator (a mis-keyed fact is a correctness bug, an
      absent one only costs performance). Identity: with facts absent the
      encoder output is byte-identical to the default path. Trust boundary: an
      input `wsc.facts` is stripped UNCONDITIONALLY on re-emit — including on
      the facts-off default path — so an inherited or forged section can never
      preempt (first-wins) or masquerade as facts loom proved this run;
      non-`wsc.*` custom sections still round-trip. Under-P discharge: a range
      premise licenses a fits-below-bit obligation, and an insufficient premise
      does not.
    fields:
      method: automated-test
      steps:
        - run: |
            cargo test --release --lib -p loom-core --features verification -- wsc_facts
    status: verified
    release: v1.3.0
    tags: [v130, verification, proof-carrying-facts]
    links:
      - type: verifies
        target: REQ-12
      - type: verifies
        target: REQ-14
      - type: verifies
        target: REQ-5

  - id: TEST-WSC-FACTS-SOURCE
    type: feature
    title: proof-carrying wsc.facts value-range SOURCE (#231)
    description: >
      Verifies the producer's fact SOURCE — the half that populates the
      channel the emitter ships. Every derived range is STRUCTURAL (a property
      of the value's own term shape, not of the program point), which is what
      makes value-keying sound: non-negative constants yield [c, c], `x & K`
      for a non-negative constant K yields [0, K] because the result's set
      bits are a subset of K's, and the integer comparisons and `eqz` yield
      [0, 1] by definition. Silence over guessing: a value the source cannot
      justify — an unconstrained local, a sum of unknowns, a mask whose sign
      bit is free, a shift by an unknown amount — carries NO fact. Operator
      keying: the walk models only operators that encode 1:1 and stops at the
      first one outside that set (all structured control flow included), so a
      fact's value_id is the operator ordinal a consumer decodes; each test
      re-decodes the emitted binary and asserts the operator at value_id is
      the one the fact claims. Renumbering safety: collection runs on the
      FINAL body, so a fact-bearing value deleted by a later pass yields no
      fact and the survivors are re-keyed to the post-pass indices rather than
      left pointing at operators that moved. Determinism: the same module
      yields an identical fact vector. Identity: a module with no derivable
      fact encodes byte-identically to the default path.
    fields:
      method: automated-test
      steps:
        - run: |
            cargo test --release --lib -p loom-core --features verification -- mask_yields_zero_to_mask_range_fact constant_folded_value_yields_point_range_fact unjustifiable_values_yield_no_fact walk_stops_at_structured_control_flow value_deleted_by_a_later_pass_is_dropped_not_miskeyed facts_use_the_full_function_index_and_bool_range fact_collection_is_deterministic no_derivable_fact_means_no_section
    status: verified
    release: v1.4.0
    tags: [verification, proof-carrying-facts]
    links:
      - type: verifies
        target: REQ-1
      - type: verifies
        target: REQ-4
      - type: verifies
        target: REQ-5
      - type: verifies
        target: REQ-12
      - type: verifies
        target: REQ-14

  # ============================================================================
  # #277 — Tier-1 of the solver migration. The algebraic rule verifier runs on
  # our own certificate-checked QF_BV engine, with the incumbent kept as a
  # differential oracle. The evidence is not a summary line: in `both` mode the
  # harness runs BOTH engines on every obligation and PANICS on any divergence,
  # so a green run is the assertion.
  # ============================================================================

  - id: TEST-RULE-SOLVER-DIFFERENTIAL
    type: feature
    title: algebraic rule verifier on a certificate-checked solver, differentially cross-checked (#277 Tier-1)
    description: >
      Verifies that loom's algebraic rewrite rules are discharged by a swappable
      solver backend (LOOM_VERIFY_BACKEND = z3 | ordeal | both) and that the two
      engines agree. The rule verifier reports 38/38 rules proven (100.0%) under
      the incumbent AND under our own engine, which additionally re-checks each
      UNSAT certificate (LRAT) before the verdict is believed. In `both` mode the
      differential solver runs both engines per obligation and panics on any
      disagreement; the suite passing IS the no-divergence assertion. Scope: this
      is the rule verifier only — the core translation validator has not been
      migrated, and that gap is stated in the release notes rather than implied
      to be closed.
    fields:
      method: automated-test
      steps:
        - run: |
            LOOM_VERIFY_BACKEND=both cargo test --release --lib -p loom-core --features verification -- test_verify_all_rules
    status: verified
    release: v1.3.0
    tags: [v130, verification, solver-migration]
    links:
      - type: verifies
        target: REQ-6
      - type: verifies
        target: REQ-1
      - type: verifies
        target: REQ-4

  # ============================================================================
  # #239 Phase B / #303 — component-level reachability GC.
  #
  # A component whose whole interface is scalar still ships `cabi_realloc`: the
  # core module exports it, so core-module DCE keeps it, and nothing at the
  # component level ever names it. Downstream that is three permanently
  # unreached branches in an MC/DC report — a coverage row a safety argument can
  # never close, once per fused component. Phase B removes it, and the evidence
  # has to argue BOTH directions: that the dead one goes, and that the live one
  # stays. A GC that removed everything would pass the first assertion alone.
  # The #196 guard (a function reachable only through an element / indirect-call
  # table must never be touched) and the conservative-on-failure behaviour are
  # asserted explicitly, as is the authoritative validate-and-revert backstop —
  # exercised with a deliberately WRONG liveness map, because an untested revert
  # path is not a safety net.
  # ============================================================================

  - id: TEST-239B-COMPONENT-REACHABILITY-GC
    type: feature
    title: component-level reachability GC removes only provably-unreachable core functions (#239 Phase B, #303)
    description: >
      Verifies the #239 Phase B mark-and-sweep over a component's
      export → instance → alias → canon lift/lower → core-func graph. Removal
      only: no adapter or canonical-ABI behaviour is altered, so the component's
      external interface and its lifting/lowering contract are identical before
      and after.
      Asserted, on components assembled in-tree from the component text format:
      (1) an unreachable `cabi_realloc` on an all-scalar interface is REMOVED —
      export and body — and the output still validates; (2) the same function is
      PRESERVED when a canon lift names it via its `(realloc ...)` option, which
      is what makes (1) a real assertion rather than a vacuous one; (3) a
      function reachable only through an element segment / indirect-call table
      is preserved and its module comes through byte-identical (#196); (4) the
      analysis BAILS — the pass becomes a no-op rather than erroring or mangling
      — on unparseable input, on a core module presented as a component, on a
      truncated component, on a nested component, and on a canonical entry the
      analysis does not model; (5) the authoritative post-pass
      validate-and-revert restores a byte-identical Phase-B-free result when fed
      a liveness map that lies. Two unit guards cover the eligibility gates: a
      reference-typed global is refused (the encoder re-emits the global section
      verbatim while dead-function elimination renumbers, so a frozen `ref.func`
      would silently re-point — the #196 failure class), and so is a module with
      a function-referencing element table. Scope stated plainly: only core
      functions behind unreferenced core-module exports are removed; unreachable
      canon lifts, aliases and component type definitions are NOT pruned, and
      there is no behavioral differential — that rides #238.
    fields:
      method: automated-test
      steps:
        - run: |
            cargo test --release --lib -p loom-core --features verification -- test_239b_
    status: verified
    release: v1.4.0
    tags: [v130, component-model, reachability-gc, safety]
    links:
      - type: verifies
        target: REQ-5
      - type: verifies
        target: REQ-11
      - type: verifies
        target: REQ-12
      - type: verifies
        target: REQ-3

  # ============================================================================
  # #326 — a latent silent miscompile of the #196 class, found while building
  # #239 Phase B and fixed before it could be exercised. `ref.func` is not in
  # the dead-function sweep's liveness closure and the global section is
  # re-emitted verbatim, so a funcref global could be left pointing at a
  # different function after renumbering. The sweep now declines such modules.
  # The CONTROL test is the load-bearing half: without it, a guard that always
  # bailed would satisfy the primary assertion.
  # ============================================================================

  - id: TEST-326-FUNCREF-GLOBAL-GUARD
    type: feature
    title: dead-function sweep declines modules whose globals may hold ref.func (#326)
    description: >
      Verifies that eliminate_dead_functions REFUSES to sweep a module whose
      raw global section may contain a `ref.func` initializer. Two facts made
      this a silent miscompile: `collect_function_refs_recursive` matches
      `Instruction::Call` only, so `ref.func` is not a liveness root; and the
      encoder re-emits `global_section_bytes` verbatim, so a `ref.func N` frozen
      there is never renumbered. A function referenced only by a funcref global
      was therefore swept while the frozen index kept designating whichever
      function inherited it — valid wasm, wrong behaviour, invisible to
      structural validation. This is the same hazard #196 shipped through the
      element section (remapped since); the global section was never covered.
      An unparseable global section is treated as hazard-present. Paired with a
      control asserting numeric-only globals still permit the sweep, so the
      guard cannot degrade into a blanket disable without failing a test.
    fields:
      method: automated-test
      steps:
        - run: |
            cargo test --release --lib -p loom-core --features verification -- t326_funcref_global_blocks_the_dead_function_sweep t326_numeric_only_globals_do_not_block_the_sweep
    status: verified
    release: v1.4.0
    tags: [v140, verification, safety, dead-code]
    links:
      - type: verifies
        target: REQ-1
      - type: verifies
        target: REQ-3
      - type: verifies
        target: REQ-5
      - type: verifies
        target: REQ-12
