  # #332 / #331 — v1.4.1: the tool must not report more than it checked.
  #
  # Two independent findings with one root: a claim reaching a caller that the
  # code never substantiated. `loom verify` led with a checkmark and exited 0
  # without opening its argument, and the free verification entry point turned
  # a solver-internal panic into a crash rather than a refusal. Both are
  # REQ-3 (no silent failures) violations reached from opposite directions —
  # one says too much, the other says nothing at all.
  # ============================================================================

  - id: TEST-332-VERIFY-REPORTS-NO-VACUOUS-SUCCESS
    type: feature
    title: "`loom verify` has no success path while it verifies nothing (#332)"
    description: >
      Verifies that the `verify` subcommand cannot report success. As shipped
      in v1.2.0 it printed a leading checkmark, never opened its argument, and
      exited 0 for all four of the reported negative controls — a wasm module
      passed where an ISLE file was expected, a path that did not exist, a file
      containing arbitrary text, and an empty file. The "not yet implemented"
      line was present and honest but sat below the checkmark and never reached
      the exit code, which is the only thing automation reads.
      Asserted, by executing the real binary: (1) each of the four reported
      negative controls exits NON-ZERO with an empty stdout; (2) a directory
      argument is refused; (3) a WELL-FORMED ISLE file ALSO fails — this is the
      load-bearing case, because every other assertion here would still hold
      for a validator that rejects bad input and then reports success for good
      input, which is the same vacuous gate wearing a coat; (4) the exit code
      is distinct from the code an ordinary optimization failure produces, so
      "this build cannot verify anything" stays distinguishable from
      "verification ran and rejected something" once Phase 5 makes the second
      outcome possible; (5) no documentation advertises the command as
      runnable — the two references that did used a two-wasm form the CLI has
      never accepted, and fixing the exit code while a doc still recommended
      the command would have left half the defect in place.
    fields:
      method: automated-test
      acceptance-criteria:
        - "Given any of the four reported negative controls, the exit code is non-zero and stdout is empty"
        - "Given a well-formed .isle file, the command STILL exits non-zero and says plainly that nothing was verified"
        - "Given the output, no checkmark appears while there is nothing to check"
        - "Given the docs tree, no line invokes `loom verify` as a runnable command"
      steps:
        - run: |
            cargo test --release -p loom-cli --test verify_subcommand
    status: verified
    release: v1.4.1
    tags: [v141, cli, honesty, no-silent-failures]
    links:
      - type: verifies
        target: REQ-3
      - type: verifies
        target: REQ-2
      - type: verifies
        target: REQ-10

  - id: TEST-331-FREE-VERIFY-ENTRY-POINT-IS-PANIC-SAFE
    type: feature
    title: the free verification entry point converts solver panics into refusals, not crashes (#331 Gap 2)
    description: >
      Verifies that `verify_function_equivalence` no longer propagates a
      solver-internal panic. Encoding can panic inside the solver bindings
      before any solver is consulted — a mixed-width BitVec binop, or an
      unwrap-on-None in the `ite` constructor when the arms have different
      sorts — both reachable from a `Select` over mixed i32/i64. The
      TranslationValidator path has always caught these and reverted cleanly;
      the free function did not, so two public entry points behaved
      differently with nothing in either signature saying which.
      Asserted on the in-tree fused-records fixture: (1) none of the four
      identified functions propagates a panic through the free entry point;
      (2) the outcome is `Err` — nothing established — and NEVER `Ok(true)`,
      because a proof obtained by not finishing the proof is worse than the
      crash it replaces; (3) at least one of those functions still fails to
      encode, so the guard is exercised rather than vacuous (#289) — if the
      fixture ever stops reaching the panic path the test says so instead of
      passing quietly. Confirmed discriminating: with the fix reverted the test
      reports "propagated 4 panic(s)" and fails.
    fields:
      method: automated-test
      acceptance-criteria:
        - "Given the four mixed-width Select functions, ZERO panics escape the free entry point"
        - "Given an encoding failure, the result is Err (not established), never Ok(true)"
        - "Given the fixture, at least one function still fails to encode, so the guard is reachable"
      steps:
        - run: |
            cargo test --release -p loom-core --features verification --test verification -- t331_free_verify_entry_point_converts_solver_panics_into_errors
    status: verified
    release: v1.4.1
    tags: [v141, verification, honesty, no-silent-failures]
    links:
      - type: verifies
        target: REQ-3
      - type: verifies
        target: REQ-5

  - id: TEST-331-VERIFICATION-COVERAGE-IS-REPORTED
    type: feature
    title: the optimizer reports what verification established, with a denominator, and names what it kept unproven (#331 Gap 1)
    description: >
      Verifies that `loom optimize --stats` reports verification coverage.
      Two defects motivated this. First, nothing surfaced a DENOMINATOR: the
      revert counters answer "how often did verification catch something?" but
      cannot answer "how much was verified at all?", and the outcome that
      matters most is invisible to a revert count by construction — a
      transform KEPT without a proof does not revert, so it never appears. A
      `VerificationCoverage` tracker with the full taxonomy had existed in the
      verifier, documented with the exact summary line it was meant to
      produce, with ZERO non-test callers. Second, the solver size-threshold
      bypass recorded itself through the revert counter and then returned
      acceptance, so the tool printed "N function(s) reverted" for functions
      that shipped — a stat naming the wrong outcome, which reads as evidence
      verification did its job in precisely the case where it did not run.
      Asserted by driving the real binary over a real 724-function module:
      (1) coverage is printed at all; (2) the proven count carries its
      denominator; (3) nothing is reported under the size-skip revert label
      any more; (4) the kept-without-proof bucket is REACHED on this module
      and attributed BY REASON, so the count can be acted on — without this
      every other assertion would still pass for an implementation that never
      records the bucket, which is the failure mode that left the original
      tracker unread; (5) an incomplete run says so in words. Paired with a
      positive control on a fully-proven module asserting the warning is
      ABSENT, so it cannot degrade into an unconditional caveat that carries
      no information. Unit tests pin that a run which attempted nothing
      reports no percentage rather than 100%.
      Also corrects the disabled-feature coverage stub, which reported every
      function as verified for a build that verified nothing — the same claim
      -without-a-basis as #332, one layer deeper and pre-loaded rather than
      fired. Those functions now land in a NEW `not_attempted` bucket rather
      than borrowing `verification_error`: every other bucket asserts
      something specific, and reporting a timeout that never happened would
      trade one false statement for another. That arm is exercised by a test
      compiled only when the feature is off, because the default test run
      cannot see it.
      Classification happens at the DECISION SITE (via a thread-local note)
      rather than by re-deriving a predicate in the accounting wrapper:
      several acceptances are decided by the encoding result, not by anything
      visible in the function's shape, and an accounting layer that guesses is
      one that can disagree with what it accounts for. This caught a real
      overclaim during review — the void-function auto-pass, whose own comment
      calls the equivalence vacuous, was initially counted as proven.
    fields:
      method: automated-test
      acceptance-criteria:
        - "Given a real module, --stats prints a proven count WITH its denominator"
        - "Given the size-threshold bypass, it is reported as kept-without-proof and NOT as a revert"
        - "Given a run that kept transforms unproven, the reason is named and the run says it is incomplete"
        - "Given a fully-proven run, the unproven-transform warning is ABSENT"
        - "Given zero attempts, no percentage is reported (never 100%)"
        - "Given a build without the verification feature, coverage reports functions as not-attempted and NOT as verified, and not as errors either"
        - "Given an acceptance that discharges no obligation, it is counted as kept-without-proof rather than proven"
      steps:
        - run: |
            cargo test --release -p loom-cli --test verification_coverage
        - run: |
            cargo test --release -p loom-core --features verification --lib stats::
        # The disabled-feature arm is INVISIBLE to the two runs above — they
        # both compile `verification` in. Without this step the criterion
        # about a no-verification build would be asserted by nothing, which
        # is the defect class this artifact exists to close.
        - run: |
            cargo test -p loom-core --no-default-features --lib disabled_feature_coverage
    status: verified
    release: v1.4.1
    tags: [v141, verification, honesty, no-silent-failures, observability]
    links:
      - type: verifies
        target: REQ-3
      - type: verifies
        target: REQ-1

  # ============================================================================
  # #346 / #345 — v1.4.1: the binary must not emit what it has not validated.
  #
  # The encoder never emitted a data count section — there was no reference to
  # it anywhere in the crate — so any module using `memory.init` or `data.drop`
  # came out structurally INVALID. Nothing caught it, because the #257
  # output-validation backstop lives inside `optimize_module` and the CLI
  # drives the passes directly (#345). A guarantee reachable only from a
  # function nobody calls is prose, not a guarantee.
  # ============================================================================

  - id: TEST-346-OUTPUT-IS-VALIDATED-BEFORE-IT-IS-WRITTEN
    type: feature
    title: the data count section is emitted, and no unvalidated module is ever written (#346, #345)
    description: >
      Verifies both halves of the #346 defect. The narrow half: the encoder
      now emits the data count section (id 12, between element and code)
      whenever `memory.init` or `data.drop` survive into the output. The spec
      makes that section mandatory for those instructions — it exists so they
      can be validated without scanning the data section — and loom preserved
      the data section and the instructions while dropping the section that
      makes them legal.
      The systemic half, which is the one that generalises: every CLI write
      path now runs the authoritative WebAssembly spec validator BEFORE
      writing, using the same check `optimize_module` has applied since #257.
      On failure the ORIGINAL input is written instead — but only after the
      original is itself proven valid, so a `.wat` input or an
      already-invalid one is never copied over the output path and presented
      as a module — and the exit code is non-zero. Worst case becomes
      unoptimized-but-valid output; success can no longer be printed over an
      invalid artifact.
      Asserted: (1) a module using `memory.init` and `data.drop` is emitted
      valid AND carries a data count section — the second assertion matters
      because validation alone would also pass if the instructions were
      simply deleted; (2) across every valid in-tree wasm fixture, a
      successful exit implies the artifact on disk validates; (3) fed bytes
      that definitely do not validate, the gate REFUSES, does not write them,
      and restores the original; (4) fed valid bytes it writes them
      byte-for-byte — the positive control, without which a gate that refused
      everything would pass (3).
      Confirmed discriminating: with the encoder fix reverted, (1) fails on
      "data count section required".
    fields:
      method: automated-test
      acceptance-criteria:
        - "Given a module using memory.init/data.drop, the output validates AND contains a data count section"
        - "Given any valid fixture, exit 0 implies the written artifact validates"
        - "Given bytes that do not validate, the gate refuses, writes the original instead, and exits non-zero"
        - "Given valid bytes, the gate writes them unchanged"
        - "Given an original that is not itself valid wasm, it is NOT written over the output path"
      steps:
        - run: |
            cargo test --release -p loom-cli --test output_validation
        - run: |
            cargo test --release -p loom-cli --bin loom -- the_output_gate
    status: verified
    release: v1.4.1
    tags: [v141, encoder, honesty, no-silent-failures, safety]
    links:
      - type: verifies
        target: REQ-3
      - type: verifies
        target: REQ-12
      - type: verifies
        target: REQ-1

  # ============================================================================
  # #347 — v1.4.1: bound the quantity that actually drives solver cost.
  #
  # 97 of 100 real-world components exceeded a 60 s budget; one 463 KB fused
  # module ran past 455 s and was killed, while a structurally denser 1.13 MB
  # ordinary module finished in 39 s. Profiling put 97% of wall clock inside
  # the solver and 40% of the whole process inside its ARRAY theory
  # instantiating store axioms pairwise. Instruction count — the only quantity
  # loom bounded — does not track that at all.
  # ============================================================================

  - id: TEST-347-MEMORY-OP-BOUND
    type: feature
    title: the translation validator bounds array-modelled memory operations, and refuses rather than ships what it declines to verify (#347)
    description: >
      Verifies the memory-operation bound that makes store-dense inlines
      terminate. The cost driver is the solver's array theory, whose store
      axioms are instantiated pairwise, so cost grows quadratically in memory
      accesses per body — a quantity inlining multiplies by concatenating
      callee bodies into their caller, which is why only the inliner triggers
      it.
      Two design decisions are recorded because both were reached by
      measurement and both could reasonably have gone the other way.
      FIRST, exceeding the bound REVERTS rather than keeps. The existing
      instruction bound keeps, and copying that here would have shipped
      thousands of unproven transforms per module at this bound — the wrong
      direction for a charter whose rule is to skip rather than risk. Refusing
      costs optimization and costs nothing in safety. The instruction bound's
      keep-behaviour is left untouched and the inconsistency stated rather
      than quietly harmonised.
      SECOND, tiny bodies are EXEMPT. Without the exemption the bound must be
      2 or lower for the 463 KB module to finish, while #219's memory-seam and
      division-seam dissolution require 4 or higher — irreconcilable, and the
      naive bound silently broke a shipped, silicon-validated capability. The
      exemption resolves it: measured 45 s (from >455 s killed) with the seam
      intact, and slightly BETTER proof coverage than without it (49.8% vs
      45.2%).
      A wall-clock budget would generalise better and is deliberately not
      used: which functions got verified would depend on machine speed, so the
      same input could produce different output, violating REQ-14. A count is
      the only mechanism here that stays deterministic. The solver's own
      timeout is wired and measurably does NOT bound this — at 100 ms the pass
      still exceeded 120 s, because the cost is axiom instantiation rather
      than the search a timeout guards.
      Asserted: (1) the counter counts array-modelled loads and stores; (2) it
      sees through block/if bodies, so a body cannot hide its stores under the
      bound; (3) it does NOT count float or partial-width accesses, which bail
      earlier and never reach the array theory; (4) a tiny memory-dense body
      is exempt — the #219 property, asserted directly rather than left
      implicit in the seam tests; (5) a LARGE memory-dense body is not exempt,
      the control without which the bound could never fire.
      This is a BOUND, not a solution: it buys termination by declining the
      hardest obligations. They are discharged only when the memory model
      stops being the incumbent's array theory (#313 slice 5).
    fields:
      method: automated-test
      acceptance-criteria:
        - "Given a body with nested stores, all of them are counted"
        - "Given float/partial-width accesses, none are counted"
        - "Given a tiny memory-dense body, the bound does NOT apply (#219 seams keep dissolving)"
        - "Given a large memory-dense body, the bound DOES apply"
        - "Given the bound fires, the transform is REVERTED and the revert is attributed by reason"
        - "Given the #347 module at default settings, the full pipeline completes and the output validates"
      steps:
        - run: |
            cargo test --release -p loom-core --features verification --lib memory_bound_tests_347
        - run: |
            cargo test --release -p loom-core --features verification --lib -- seam_fully_dissolves
    status: verified
    release: v1.4.1
    tags: [v141, verification, performance, solver-migration]
    links:
      - type: verifies
        target: REQ-5
      - type: verifies
        target: REQ-14
      - type: verifies
        target: REQ-3

  - id: TEST-AARCH64-LINUX-RELEASE-TARGET
    type: feature
    title: aarch64-unknown-linux-gnu is built, gated and shipped like every other Linux target
    description: >
      PARTIALLY EVIDENCED. One of the four criteria below is now proven and
      three are not, so this stays `draft`.
      PROVEN (PR #364 CI): the `Build (ubuntu-22.04-arm)` job ran and
      SUCCEEDED, which establishes the three things that were actually in
      doubt — that arm64 Linux runners are available to this repository, that
      `z3-sys` compiles its vendored C++ natively on ARM, and that loom builds
      for the target at all.
      NOT YET PROVEN: the three release-side criteria. The archive being
      published, the glibc floor being asserted from the ARM binary's symbols,
      and the binary being smoke-run all live in `release.yml`, which fires
      only on a tag push. Their code is written and reviewed; none of it has
      executed. Marking this `verified` on the CI job alone would assert
      exactly the kind of untested gate the rest of this release exists to
      remove, so it flips only after a tag has actually produced the asset.
      v1.4.1 shipped four binaries: x86_64-linux, both macOS arches and
      Windows. ARM Linux — servers, arm64 containers, ARM CI runners, single
      board machines — had no binary at all and had to build from source with
      a C++ toolchain, which is the dependency #313 exists to remove. The
      earlier deferral note in the release workflow gave the reason as
      "cross-compiling z3-sys for aarch64-linux is untested". That was true and
      is now moot: the target builds NATIVELY on a GitHub-hosted arm64 Linux
      runner, so nothing is cross-compiled, and those runners are free for
      public repositories, which this one is. z3-sys vendors and statically
      compiles z3, so no host libz3 is needed on any runner, ARM included.
      The load-bearing decision is WHERE the evidence lives. `release.yml`
      only fires on a tag push, so adding the target there alone would ship it
      on the strength of a job that had never run — the unexercised-gate shape
      this repository keeps finding, and the one v1.4.1 exists to punish. The
      target is therefore also built on EVERY PR via the CI matrix, so a
      toolchain or z3-sys regression on ARM fails a check immediately rather
      than during a release.
      Both #311 gates are extended to the new target rather than left
      x86_64-only: the glibc/libstdc++ floor is ASSERTED from the ARM binary's
      own symbols, and the binary is SMOKE-RUN natively on the ARM image it
      was built for. A shipped target whose floor is merely hoped-for is how
      v1.2.0 went out unloadable.
    fields:
      method: automated-test
      acceptance-criteria:
        - "PROVEN: given any PR, the aarch64-linux build runs and succeeds in CI"
        - "PENDING A TAG: an aarch64-unknown-linux-gnu archive is published alongside the others"
        - "PENDING A TAG: the ARM binary's glibc/libstdc++ floor is asserted from its own symbols, fail-closed"
        - "PENDING A TAG: the ARM binary is executed on the ARM runner, not merely inspected"
      # No `steps:` deliberately. Every criterion below is either evidenced by
      # a CI job that this artifact cannot re-run from inside the gate, or is
      # PENDING A TAG and has no command that can pass yet. An earlier draft of
      # this artifact carried `gh release view <tag> ...` — a literal
      # placeholder, and `<tag>` is shell redirection, so the command could
      # never succeed. That would have made the verification gate permanently
      # red on account of work that is correctly marked unfinished, which is
      # the failure #353 is about. An artifact with no steps is SKIPPED, which
      # is the honest state for one that is not yet verifiable.
    status: draft
    release: v1.5.0
    tags: [v150, release-engineering, portability]
    links:
      - type: verifies
        target: REQ-18
      - type: verifies
        target: REQ-12
