name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Docs-only PRs skip the compile/test suite (~226 runner-minutes per run).
  # Job-level `if:` on this detector, never workflow-level `paths:` — a job
  # skipped by `if:` still reports, a workflow that never starts does not.
  # FAILS CLOSED: any event other than pull_request, an absent base, a failed
  # or empty diff, or any changed file that is not a `.md`/LICENSE file runs
  # everything. A `.md` whose basename appears in any `.rs` file also counts as
  # code — loom-cli/tests/verify_subcommand.rs reads
  # docs/analysis/synth-architecture.md at test time. rivet-validate is not
  # gated: it validates artifact content and must run on every PR.
  # Gated jobs use `!cancelled() && code != 'false'`, so a FAILED detector runs
  # them (empty output) rather than skipping them as GitHub's implicit
  # success() would.
  # This workflow carries no required context, so it does not run on
  # merge_group; verification-gate.yml does.
  changes:
    name: Detect changed areas
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          run_all() { echo "code=true" >> "$GITHUB_OUTPUT"; echo "→ $1; running the full suite"; exit 0; }
          [ "$EVENT_NAME" = "pull_request" ] || run_all "event $EVENT_NAME"
          [ -n "$BASE_SHA" ] || run_all "no base sha"
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)" || run_all "git diff failed against $BASE_SHA"
          [ -n "$changed" ] || run_all "git diff returned no paths"
          echo "changed files:"; echo "$changed"
          while IFS= read -r f; do
            case "$f" in
              *.md|LICENSE|LICENSE-*) ;;
              *) run_all "non-docs file $f" ;;
            esac
            if git grep -qF -- "$(basename "$f")" -- '*.rs'; then
              run_all "$f is referenced from Rust source"
            fi
          done <<< "$changed"
          echo "code=false" >> "$GITHUB_OUTPUT"
          echo "→ docs-only change; skipping the compile/test suite"

  rivet-validate:
    name: Rivet Artifact Traceability
    # Routes fork PRs to GitHub-hosted runners by default. This is NOT a security
    # boundary: a fork PR can edit this file. Isolation is enforced by the org's
    # smithy runner-group policy and fork-PR approval (pulseengine/warte#35).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: rivet
      # The pin used to be v0.3.1, but on 3e8ebb8's run that is not what
      # validated: cargo reported v0.3.1 "already installed", yet the `rivet`
      # that ran printed the modern `Schemas: … (embedded)` line, which 0.3.x
      # does not emit, and passed. v0.3.1 run directly FAILS this tree with 85
      # errors. Whether PATH or a replaced binary caused it, the job validated
      # with whatever the runner had. Pin a version that passes, assert it, and
      # invoke the installed binary by path.
      - name: Install rivet
        run: |
          cargo install --git https://github.com/pulseengine/rivet.git --tag v0.40.0 rivet-cli --locked
          "${CARGO_HOME:-$HOME/.cargo}/bin/rivet" --version | grep -q '^rivet 0\.40\.0 '
      - name: Validate artifacts
        # No `|| echo` fallback (#426). rivet#129, which it cited, is closed.
        # `rivet validate` exits 0 on a pass with warnings and 1 only on an
        # error, so the fallback hid nothing but real failures, such as an
        # artifact file that no longer parses.
        run: '"${CARGO_HOME:-$HOME/.cargo}/bin/rivet" validate'
      - name: Check traceability coverage
        run: '"${CARGO_HOME:-$HOME/.cargo}/bin/rivet" coverage'
      - name: Artifact statistics
        run: '"${CARGO_HOME:-$HOME/.cargo}/bin/rivet" stats'

  lockfiles:
    name: Lockfiles committed, current and audited
    # Not gated on `changes`: a lockfile or manifest edit is a code change, and
    # an advisory can land with no change here at all.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit@0.22.1
      # Fails when a Cargo workspace or MODULE.bazel has no committed lockfile,
      # when a lockfile is gitignored, or when a Cargo.lock no longer matches
      # its manifests. The control removes one package from each Cargo.lock in
      # turn and requires the same check to fail on it.
      - name: Every lockfile is committed and up to date (with control)
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          committed() {
            if ! git ls-files --error-unmatch -- "$1" > /dev/null 2>&1; then
              echo "::error::$2 has no committed lockfile $1"; fail=1
            fi
            if git check-ignore -q --no-index -- "$1"; then
              echo "::error::$1 is gitignored"; fail=1
            fi
          }
          while read -r m; do
            root=$(cargo locate-project --workspace --manifest-path "$m" --message-format plain)
            lock=$(dirname "${root#"$PWD"/}")/Cargo.lock
            committed "${lock#./}" "$m"
          done < <(git ls-files | grep -E '(^|/)Cargo\.toml$')
          while read -r m; do
            committed "$m.lock" "$m"
          done < <(git ls-files | grep -E '(^|/)MODULE\.bazel$')

          locks=(); while IFS= read -r l; do locks+=("$l"); done < <(git ls-files | grep -E '(^|/)Cargo\.lock$')
          printf 'Cargo.lock files: %s\n' "${locks[*]}"
          [ "${#locks[@]}" -ge 2 ] || { echo "::error::expected at least 2 Cargo.lock files"; exit 1; }
          current() {
            cargo metadata --locked --format-version 1 \
              --manifest-path "$(dirname "$1")/Cargo.toml" > /dev/null 2> "$RUNNER_TEMP/metadata.err"
          }
          for lock in "${locks[@]}"; do
            if ! current "$lock"; then
              cat "$RUNNER_TEMP/metadata.err"; echo "::error::$lock is out of date"; fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1

          for lock in "${locks[@]}"; do
            awk -v RS= -v ORS='\n\n' '/^\[\[package\]\]/ && !done { done = 1; next } { print }' \
              "$lock" > "$RUNNER_TEMP/stale.lock"
            cp "$RUNNER_TEMP/stale.lock" "$lock"
            if current "$lock"; then
              echo "::error::control: $lock with a package removed still passes"; fail=1
            elif ! grep -q -- '--locked' "$RUNNER_TEMP/metadata.err"; then
              cat "$RUNNER_TEMP/metadata.err"
              echo "::error::control: $lock failed for another reason than --locked"; fail=1
            else
              echo "control: stale $lock fails"
            fi
            git checkout -- "$lock"
          done
          [ "$fail" = 0 ]
      # cargo audit exits non-zero on a vulnerability advisory; warnings
      # (unmaintained, unsound) are printed and do not fail. Every committed
      # Cargo.lock is audited, nested ones included. The control adds the
      # vulnerable wasmtime-wasi 50.0.2 (RUSTSEC-2026-0587) to fuzz/Cargo.lock
      # and requires the same audit loop to fail on it.
      - name: cargo audit on every Cargo.lock (with control)
        shell: bash
        run: |
          set -euo pipefail
          locks=(); while IFS= read -r l; do locks+=("$l"); done < <(git ls-files | grep -E '(^|/)Cargo\.lock$')
          printf '%s\n' "${locks[@]}" | grep -qx 'fuzz/Cargo.lock' \
            || { echo "::error::fuzz/Cargo.lock is not audited"; exit 1; }
          audit_all() {
            local rc=0
            for lock in "${locks[@]}"; do
              echo "== $lock"
              cargo audit --file "$lock" || rc=1
            done
            return "$rc"
          }
          audit_all

          printf '\n[[package]]\nname = "wasmtime-wasi"\nversion = "50.0.2"\nsource = "registry+https://github.com/rust-lang/crates.io-index"\n' >> fuzz/Cargo.lock
          if audit_all > "$RUNNER_TEMP/audit-control.out" 2>&1; then
            cat "$RUNNER_TEMP/audit-control.out"
            echo "::error::control: an advisory in fuzz/Cargo.lock did not fail the audit"; exit 1
          fi
          grep -q 'RUSTSEC-2026-0587' "$RUNNER_TEMP/audit-control.out" \
            || { cat "$RUNNER_TEMP/audit-control.out"; echo "::error::control: failed without reporting RUSTSEC-2026-0587"; exit 1; }
          git checkout -- fuzz/Cargo.lock
          echo "control: RUSTSEC-2026-0587 planted in fuzz/Cargo.lock fails the audit"

  format:
    name: Format
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # Stays on ubuntu-24.04: the vendored Z3 build needs cmake and a C++
    # toolchain, which are not confirmed on smithy hosts.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # Stays on ubuntu-24.04: matrix spans macOS + Windows; smithy is Linux-only.
    runs-on: ${{ matrix.os }}
    strategy:
      # #421: the default (true) made one transient flake look like three
      # platform failures. On run 38662406408, macOS died in 12s at the
      # `dtolnay/rust-toolchain@stable` step — no test was ever compiled — and
      # fail-fast then cancelled ubuntu and windows, which had NOT yet been
      # assigned a runner. `gh pr checks` reported all three as `fail`, so two
      # of them asserted a test failure for a suite that never ran: the same
      # "reports a state it never established" defect as #332 and #353.
      #
      # It also reclaimed nothing here, which is the usual argument for
      # fail-fast. Neither cancelled leg had started, so no runner time was
      # saved; they were simply re-run later, after the cascade had hidden
      # which OS actually broke.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # loom-core/tests/validator_trust_ledger.rs compares the ledger with the
      # base branch's copy: a line may leave only as a linked `removed:` line.
      - name: Base branch's validator trust ledger
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          f="$RUNNER_TEMP/base-validator-trust-ledger.txt"
          if git cat-file -e "$BASE_SHA:safety/VALIDATOR_TRUST_LEDGER.txt" 2>/dev/null; then
            git show "$BASE_SHA:safety/VALIDATOR_TRUST_LEDGER.txt" > "$f"
          else
            : > "$f"
          fi
          echo "LOOM_LEDGER_BASE=$f" >> "$GITHUB_ENV"
      - name: Run tests
        run: cargo test --locked --all --release --verbose

  build:
    name: Build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # Stays on ubuntu-24.04: matrix spans macOS + Windows; smithy is Linux-only.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # ubuntu-22.04-arm is here so the aarch64-linux RELEASE target has
        # continuous evidence rather than first running at tag time.
        # `release.yml` only fires on a tag push, so a target added there
        # alone would ship on the strength of an unrun job — the same
        # unexercised-gate shape this repository keeps finding. Building it
        # on every PR means a toolchain or z3-sys regression on ARM fails a
        # check now, not during a release.
        os: [ubuntu-24.04, ubuntu-22.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Vendored Z3 (z3-src) is C++20 and includes <format>, which GCC 11 (the
      # ubuntu-22.04 default) does not ship. Keep the 22.04 image -- it sets the
      # glibc floor (#311) -- and build with g++-13 from the toolchain PPA, linking libstdc++ statically.
      - name: Install g++-13 for vendored Z3 (C++20 <format>)
        if: startsWith(matrix.os, 'ubuntu-22.04')
        shell: bash
        run: |
          set -euo pipefail
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-13
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"
          # g++-13's libstdc++ needs GLIBCXX_3.4.31, above stock 22.04's 3.4.30,
          # so link libstdc++ and libgcc statically (these jobs only). Link with
          # g++-13 (so the static libstdc++.a is gcc-13's, not gcc-11's) and
          # have z3-sys emit a static -lstdc++ (rustc links with
          # -nodefaultlibs, so the driver does not add libstdc++ itself).
          echo "CXXSTDLIB=static=stdc++" >> "$GITHUB_ENV"
          # rustc itself must find libstdc++.a for a static=stdc++ link-lib.
          LIBSTDCXX_DIR=$(dirname "$(g++-13 -print-file-name=libstdc++.a)")
          test -f "$LIBSTDCXX_DIR/libstdc++.a"
          echo "RUSTFLAGS=-C linker=g++-13 -L native=$LIBSTDCXX_DIR -C link-arg=-static-libstdc++ -C link-arg=-static-libgcc" >> "$GITHUB_ENV"

      - name: Build release
        run: cargo build --locked --release --verbose
      - name: Assert the 22.04 runtime floor (GLIBC <= 2.35, GLIBCXX <= 3.4.30 or static libstdc++)
        if: startsWith(matrix.os, 'ubuntu-22.04')
        shell: bash
        run: |
          set -euo pipefail
          scripts/check_elf_floor.sh target/release/loom 2.35 3.4.30
          # Negative control: the same check against a deliberately impossible
          # ceiling must FAIL, or the step above could be passing vacuously.
          if scripts/check_elf_floor.sh target/release/loom 2.0 2.0 >/dev/null 2>&1; then
            echo "::error::negative control passed with an impossible ceiling; the floor check is vacuous"
            exit 1
          fi
          echo "negative control: impossible ceiling correctly rejected"
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: loom-${{ matrix.os }}
          path: |
            target/release/loom
            target/release/loom.exe

  validate:
    name: Validate WebAssembly Output
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install wasm-tools
        run: cargo install --locked wasm-tools
      - name: Build loom
        run: cargo build --locked --release
      - name: Optimize and validate test fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/loom-optimized"

          # All fixture tests now pass with Z3 verification!
          # CSE and simplify_locals bugs have been fixed.
          KNOWN_FAILURES=()

          unexpected_failures=()
          success_count=0

          for fixture in tests/fixtures/*.wat; do
            filename=$(basename "$fixture" .wat)
            output_file="$RUNNER_TEMP/loom-optimized/${filename}.wasm"

            # Check if this is a known failure
            is_known_failure=false
            for known in "${KNOWN_FAILURES[@]}"; do
              if [ "$filename" = "$known" ]; then
                is_known_failure=true
                break
              fi
            done

            if ! ./target/release/loom optimize "$fixture" -o "$output_file" > /dev/null 2>&1; then
              if [ "$is_known_failure" = true ]; then
                echo "⚠️  $filename (known Z3 verification failure - tracked)"
              else
                echo "❌ $filename (UNEXPECTED FAILURE)"
                unexpected_failures+=("$filename")
              fi
              continue
            fi

            if ! wasm-tools validate "$output_file" > /dev/null 2>&1; then
              echo "❌ $filename (output validation failed)"
              unexpected_failures+=("$filename")
              continue
            fi

            echo "✅ $filename"
            success_count=$((success_count + 1))
          done

          echo ""
          echo "Results: $success_count passed, ${#KNOWN_FAILURES[@]} known failures, ${#unexpected_failures[@]} unexpected"

          if [ ${#unexpected_failures[@]} -gt 0 ]; then
            echo "❌ Unexpected failures:"
            for f in "${unexpected_failures[@]}"; do
              echo "  - $f"
            done
            exit 1
          fi

          echo "✅ All tests passed (known failures tracked for fixing)"

  coverage:
    name: Code Coverage
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # Stays on ubuntu-24.04: uses `sudo rm -rf` to free disk space on the
    # GitHub-hosted image. Could migrate by dropping the free-disk step
    # (smithy has plenty of disk via lv_runners) but leaving as-is for now.
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: coverage
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # cargo-llvm-cov
      - name: Generate coverage
        # Exclude verification feature - it's tested separately in z3-verification job
        # and Z3 compilation + LLVM instrumentation together exhaust disk space
        run: cargo llvm-cov --locked --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./lcov.info
          fail_ci_if_error: false

  benchmark:
    name: Benchmarks
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Use separate cache for benchmarks (no verification)
          key: bench-no-verify
      - name: Run benchmarks
        # Disable verification for benchmarks - we're measuring optimization perf
        run: cargo bench --locked --no-fail-fast --no-default-features

  verify:
    name: Z3 Verification Build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # Stays on ubuntu-24.04: the vendored Z3 build needs cmake and a C++
    # toolchain, which are not confirmed on smithy hosts.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build with verification feature
        run: cargo build --locked --release --features verification
      - name: Test verification
        run: |
          # Use bench_compare.wat which passes all verification
          ./target/release/loom optimize tests/fixtures/bench_compare.wat \
            -o "$RUNNER_TEMP/test.wasm" --verify --stats
      - name: Verify all fixtures with Z3
        run: |
          verified=0
          skipped=0
          for fixture in tests/fixtures/*.wat; do
            filename=$(basename "$fixture")
            echo "Verifying: $filename"
            if ./target/release/loom optimize "$fixture" -o "$RUNNER_TEMP/verified_output.wasm" --verify --stats 2>&1; then
              verified=$((verified + 1))
            else
              echo "Z3 verification issue: $filename (non-fatal, tracking coverage)"
              skipped=$((skipped + 1))
            fi
          done
          echo ""
          echo "Z3 fixture verification: $verified verified, $skipped skipped"
      - name: Verify WASM test files with Z3
        run: |
          verified=0
          skipped=0
          found=false
          for wasm_file in tests/*.wasm; do
            [ -f "$wasm_file" ] || continue
            found=true
            filename=$(basename "$wasm_file")
            echo "Verifying: $filename"
            if ./target/release/loom optimize "$wasm_file" -o "$RUNNER_TEMP/verified_output.wasm" --verify --stats 2>&1; then
              verified=$((verified + 1))
            else
              echo "Z3 verification issue: $filename (non-fatal, tracking coverage)"
              skipped=$((skipped + 1))
            fi
          done
          if [ "$found" = false ]; then
            echo "No .wasm test files found (skipping)"
          else
            echo ""
            echo "Z3 WASM verification: $verified verified, $skipped skipped"
          fi

  differential-gate:
    name: Behavioral Differential Gate (#238)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # ubuntu-24.04: default features pull `verification` (needs z3); the
    # `differential` feature additionally pulls wasmtime. Both build here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build loom with the differential gate
        run: cargo build --locked --release -p loom-cli --features differential
      - name: Differentially gate the runnable core-module corpus
        run: |
          # Policy (#238): the CLI `--differential` gate HARD-FAILS on BOTH
          # divergence and inconclusive (it refuses to certify behavior it never
          # observed). For this fixed corpus the CI job is a narrower consumer:
          #   - DIVERGENCE / invalid output -> CI FAILURE (a real miscompile)
          #   - inconclusive (no runnable export / exec coverage gap)
          #                                 -> logged SKIP, not a CI failure
          # Component fixtures are excluded: component-model execution is not
          # wired yet, so they are always inconclusive (gap tracked in #238/#239).
          set -u
          corpus=(tests/corpus/*.wasm loom-core/tests/fixtures/repro-219/sem.loom.wasm)
          certified=0; skipped=0; diverged=()
          for w in "${corpus[@]}"; do
            [ -f "$w" ] || continue
            name=$(basename "$w")
            if log=$(./target/release/loom optimize "$w" -o "$RUNNER_TEMP/diff_out.wasm" --differential 2>&1); then
              echo "✅ certified: $name"
              certified=$((certified + 1))
            elif echo "$log" | grep -q "inconclusive"; then
              echo "⏭️  inconclusive (skipped, not runnable): $name"
              skipped=$((skipped + 1))
            else
              echo "❌ DIVERGENCE / invalid: $name"
              echo "$log" | tail -3
              diverged+=("$name")
            fi
          done
          echo ""
          echo "Differential gate: $certified certified, $skipped inconclusive-skipped, ${#diverged[@]} diverged"
          if [ "${#diverged[@]}" -gt 0 ]; then
            echo "❌ behavioral divergence on: ${diverged[*]}"
            exit 1
          fi
          if [ "$certified" -eq 0 ]; then
            echo "❌ gate certified 0 modules — corpus or executor regression"
            exit 1
          fi
          echo "✅ differential gate green ($certified certified)"

  wasm-build:
    name: WASM Build (wasm32-wasip2, no Z3)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # light: no Z3 and no C++ build. Fork PRs run on ubuntu-24.04.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Exact Rust 1.100.0. Its std makes the component
      # import wasi:cli/exit@0.2.12 exit-with-code, so running it needs
      # wasmtime >= 46.0.0 (see CHANGELOG). Pin the toolchain through the
      # `toolchain` input: `@<X.Y.Z>` on the action pins the action's git tag,
      # not Rust (dependabot #206 broke main that way).
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: wasm-build-1.100.0

      # Upstream z3 (crates.io) does not build for wasm32-wasip2, so the wasm
      # artifact is built without the `verification` feature (no Z3, no ordeal).
      # Verification runs in the native jobs.
      - name: Build loom for wasm32-wasip2
        run: |
          cargo +1.100.0 build --locked --release --target wasm32-wasip2 --package loom-cli --no-default-features --features attestation

      - name: Upload WASM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: loom-wasm
          path: target/wasm32-wasip2/release/loom.wasm

  self-optimization:
    name: Self-Optimization Test
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    needs: [build, wasm-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install wasm-tools
        run: cargo install --locked wasm-tools
      - name: Download LOOM binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: loom-ubuntu-24.04
          path: ./loom-bin
      - name: Download LOOM WASM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: loom-wasm
          path: ./loom-wasm
      - name: Make binary executable
        run: chmod +x ./loom-bin/loom
      - name: Test self-optimization
        run: |
          echo "Testing LOOM self-optimization (dogfooding)..."
          INPUT="./loom-wasm/loom.wasm"
          OUTPUT="$RUNNER_TEMP/loom-optimized.wasm"

          # Verify input is valid
          wasm-tools validate "$INPUT" || { echo "Input validation failed"; exit 1; }

          # Optimize LOOM with itself
          ./loom-bin/loom optimize "$INPUT" -o "$OUTPUT" --stats || { echo "Optimization failed"; exit 1; }

          # Verify output is valid
          wasm-tools validate "$OUTPUT" || { echo "Output validation failed"; exit 1; }

          # Calculate size reduction
          INPUT_SIZE=$(stat -f%z "$INPUT" 2>/dev/null || stat -c%s "$INPUT")
          OUTPUT_SIZE=$(stat -f%z "$OUTPUT" 2>/dev/null || stat -c%s "$OUTPUT")
          REDUCTION=$((100 * (INPUT_SIZE - OUTPUT_SIZE) / INPUT_SIZE))

          echo "✅ Self-optimization successful!"
          echo "   Input:  $INPUT_SIZE bytes"
          echo "   Output: $OUTPUT_SIZE bytes"
          echo "   Reduction: $REDUCTION%"

  rocq-proofs:
    name: Rocq Formal Proofs
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # Stays on ubuntu-24.04: requires Nix + Bazel; both are out-of-scope for
    # smithy phase 1 (see migration playbook "What's currently out of scope").
    runs-on: ubuntu-24.04
    # Fails when (loom#169):
    #   - a proof stops compiling;
    #   - a .v file gains an Axiom/Parameter/Conjecture/Admitted/admit, or
    #     Rust gains a Verus external_body/assume/admit, that
    #     proofs/TRUST_LEDGER.txt does not list (removals always pass);
    #   - rocqchk, re-checking every compiled library from its .vo files,
    #     reports an axiom or theory flag proofs/ASSUMPTIONS_ALLOWLIST.txt
    #     does not list (proofs/kernel_check.bzl), or a rocq_library is not
    #     re-checked at all.
    # The listed assumptions themselves are still open under #169.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Nix
        uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-rocq
          repository-cache: true
      # rules_rocq_rust builds rocq-of-rust against rustc_private, which links
      # the nightly's libLLVM. Its repository rule forwards LIBRARY_PATH to
      # cargo; on Linux nothing sets it, so the link fails with
      # "unable to find library -lLLVM-19-rust-1.85.0-nightly". Install the
      # nightly the rule pins and hand its sysroot lib to the rule.
      - name: Install rocq-of-rust nightly
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2024-12-01 --profile minimal
          rustup component add rustc-dev rust-src --toolchain nightly-2024-12-01
          echo "ROCQ_RUST_LIB=$(rustc +nightly-2024-12-01 --print sysroot)/lib" >> "$GITHUB_ENV"
      - name: Build proofs
        run: bazel build //proofs/... --repo_env=LIBRARY_PATH="$ROCQ_RUST_LIB"
      - name: Test proofs
        run: bazel test //proofs/... --test_output=errors --repo_env=LIBRARY_PATH="$ROCQ_RUST_LIB"
      # The rocqchk checks are build targets, so "Build proofs" already ran
      # them; this step asserts none is missing and prints what they found.
      - name: Kernel re-check (rocqchk) coverage and assumptions
        run: |
          set -euo pipefail
          libs=$(bazel query 'kind("rocq_library rule", //proofs/...)')
          checks=$(bazel query 'kind("rocq_kernel_check rule", //proofs/...)')
          [ -n "$libs" ] || { echo "no rocq_library targets found"; exit 1; }
          [ -n "$checks" ] || { echo "no rocq_kernel_check targets found"; exit 1; }
          unchecked=$(bazel query 'kind("rocq_library rule", //proofs/...) except deps(kind("rocq_kernel_check rule", //proofs/...))')
          if [ -n "$unchecked" ]; then
            echo "rocq_library targets no rocq_kernel_check re-checks:"
            echo "$unchecked"
            exit 1
          fi
          echo "$(echo "$libs" | wc -l) libraries, $(echo "$checks" | wc -l) kernel checks"
          # shellcheck disable=SC2086
          bazel build $checks --repo_env=LIBRARY_PATH="$ROCQ_RUST_LIB"
          bin=$(bazel info bazel-bin --repo_env=LIBRARY_PATH="$ROCQ_RUST_LIB")
          for c in $checks; do
            pkg=${c#//}; pkg=${pkg%%:*}; name=${c##*:}
            f="$bin/$pkg/$name.assumptions.txt"
            [ -s "$f" ] || { echo "missing $f"; exit 1; }
            echo "== $c"
            grep -v '^Axioms: \(Corelib\|RocqOfRust\|loom\)\.' "$f" || true
            echo "   ($(grep -c '^Axioms: ' "$f") axioms in total)"
          done
      # .bazelrc sets --lockfile_mode=error, so the steps above fail when
      # MODULE.bazel.lock does not match MODULE.bazel. Control: drop one
      # registry hash from the lockfile and require `bazel mod deps` to fail.
      - name: Stale MODULE.bazel.lock fails (control)
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'common --lockfile_mode=error' .bazelrc
          jq 'del(.registryFileHashes[(.registryFileHashes | keys | map(select(endswith("/MODULE.bazel"))) | first)])' \
            MODULE.bazel.lock > "$RUNNER_TEMP/stale.lock"
          cp "$RUNNER_TEMP/stale.lock" MODULE.bazel.lock
          if bazel mod deps > "$RUNNER_TEMP/mod.out" 2>&1; then
            git checkout -- MODULE.bazel.lock
            echo "::error::control: a lockfile missing a registry hash passed"; exit 1
          fi
          git checkout -- MODULE.bazel.lock
          grep -q 'not permitted with --lockfile_mode=error' "$RUNNER_TEMP/mod.out" \
            || { cat "$RUNNER_TEMP/mod.out"; echo "::error::control: failed for another reason"; exit 1; }
          echo "control: stale MODULE.bazel.lock fails"
      # Runs even when a Bazel step failed, so one run reports both gates.
      - name: Trust ledger
        if: ${{ !cancelled() }}
        run: python3 scripts/proof-trust-ledger.py --check

  differential:
    name: Differential Testing (vs wasm-opt)
    # Stays on ubuntu-24.04: requires `sudo apt-get install binaryen`;
    # binaryen/wasm-opt is not provisioned on smithy hosts.
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install wasm-opt and wasm-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
          # No `|| true` (#429): without wasm-tools every row reads INVALID
          # and the comparison is skipped, which the old predicate counted as
          # zero failures.
          cargo install wasm-tools --locked
          wasm-tools --version
      - name: Build LOOM
        run: cargo build --locked --release
      - name: Run differential comparison
        run: |
          echo "## Differential Testing: LOOM vs wasm-opt" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Original | LOOM | wasm-opt -O3 | LOOM valid | wasm-opt valid |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----------|------|-------------|------------|----------------|" >> $GITHUB_STEP_SUMMARY

          loom_wins=0
          wopt_wins=0
          ties=0
          failures=0

          for fixture in tests/fixtures/*.wat; do
            filename=$(basename "$fixture")
            orig_size=$(wc -c < "$fixture")

            # Optimize with LOOM
            if ./target/release/loom optimize "$fixture" -o "$RUNNER_TEMP/loom_out.wasm" 2>/dev/null; then
              loom_size=$(wc -c < "$RUNNER_TEMP/loom_out.wasm")
              loom_valid="yes"
              wasm-tools validate "$RUNNER_TEMP/loom_out.wasm" 2>/dev/null || loom_valid="INVALID"
            else
              loom_size="-"
              loom_valid="error"
            fi

            # First compile WAT to WASM for wasm-opt
            if wasm-tools parse "$fixture" -o "$RUNNER_TEMP/orig.wasm" 2>/dev/null; then
              orig_wasm_size=$(wc -c < "$RUNNER_TEMP/orig.wasm")

              # Optimize with wasm-opt
              if wasm-opt -O3 "$RUNNER_TEMP/orig.wasm" -o "$RUNNER_TEMP/wopt_out.wasm" 2>/dev/null; then
                wopt_size=$(wc -c < "$RUNNER_TEMP/wopt_out.wasm")
                wopt_valid="yes"
                wasm-tools validate "$RUNNER_TEMP/wopt_out.wasm" 2>/dev/null || wopt_valid="INVALID"
              else
                wopt_size="-"
                wopt_valid="error"
              fi
            else
              orig_wasm_size="-"
              wopt_size="-"
              wopt_valid="skip"
            fi

            # Any LOOM outcome other than valid output is a failure (#429). The
            # old predicate fired only on INVALID-with-wasm-opt-valid, so LOOM
            # erroring on a fixture, or producing invalid output when wasm-opt
            # could not run, passed. wasm-opt's result does not excuse LOOM.
            if [ "$loom_valid" != "yes" ]; then
              echo "::error::LOOM result for $filename: $loom_valid (wasm-opt: $wopt_valid)"
              failures=$((failures + 1))
            fi

            echo "| $filename | $orig_size | $loom_size | $wopt_size | $loom_valid | $wopt_valid |" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Failures (LOOM error or invalid output): $failures" | tee -a $GITHUB_STEP_SUMMARY

          # Fail CI on any LOOM error or invalid output
          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures differential test failures detected"
            exit 1
          fi
