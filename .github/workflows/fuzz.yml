# Continuous fuzzing workflow for LOOM
# Runs fuzzing on nightly schedule and saves any crash artifacts

name: Fuzzing

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

on:
  schedule:
    # Run nightly at 2am UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual triggering
    inputs:
      duration:
        description: 'Fuzzing duration in seconds'
        default: '300'
        type: string
      target:
        description: 'Fuzz target to run'
        default: 'all'
        type: choice
        options:
          - all
          - fuzz_optimize
          - fuzz_roundtrip
          - fuzz_differential

env:
  CARGO_TERM_COLOR: always
  FUZZ_DURATION: ${{ github.event.inputs.duration || '300' }}

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: [self-hosted, linux, x64, rust-cpu]
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_optimize
          - fuzz_roundtrip
          - fuzz_differential

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('**/Cargo.lock') }}

      - name: Build fuzz targets
        working-directory: fuzz
        run: cargo +nightly fuzz build

      - name: Differential oracle self-test (negative control)
        if: matrix.target == 'fuzz_differential'
        working-directory: fuzz
        run: cargo +nightly test --lib

      - name: Run fuzzer - ${{ matrix.target }}
        # Scheduled runs have no inputs: an empty/unset target means "all".
        # (Do not compare against 'all' alone: that skips every scheduled run.)
        if: github.event.inputs.target == '' || github.event.inputs.target == 'all' || github.event.inputs.target == matrix.target
        working-directory: fuzz
        run: |
          # `seeds` holds small valid modules with exports, so the differential
          # target executes real comparisons from the first iteration instead of
          # waiting for the mutator to find a valid module from empty.
          # -max_total_time ends the run cleanly (exit 0); a crash exits non-zero
          # and fails the job. The outer timeout is only a hang backstop, with
          # headroom so it never races the fuzzer's own time limit.
          timeout $((FUZZ_DURATION + 120))s cargo +nightly fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} seeds -- \
            -max_total_time=${FUZZ_DURATION} \
            -dict=dictionaries/wasm.dict

      - name: Check for crashes
        working-directory: fuzz
        run: |
          if [ -d "artifacts/${{ matrix.target }}" ] && [ "$(ls -A artifacts/${{ matrix.target }})" ]; then
            echo "::error::Crashes found in ${{ matrix.target }}!"
            ls -la artifacts/${{ matrix.target }}/
            exit 1
          else
            echo "No crashes found in ${{ matrix.target }}"
          fi

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          retention-days: 30

      - name: Upload corpus
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}/
          retention-days: 7

  coverage:
    name: Fuzzing coverage report
    runs-on: [self-hosted, linux, x64, light]
    needs: fuzz
    if: always()

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all corpora
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: corpus-*
          path: fuzz/corpus/
          merge-multiple: true

      - name: Generate coverage summary
        run: |
          echo "## Fuzzing Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Corpus Size |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------------|" >> $GITHUB_STEP_SUMMARY
          for dir in fuzz/corpus/*/; do
            if [ -d "$dir" ]; then
              target=$(basename "$dir")
              count=$(find "$dir" -type f | wc -l)
              echo "| $target | $count |" >> $GITHUB_STEP_SUMMARY
            fi
          done
