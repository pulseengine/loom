version: 2
# Grouped monthly updates. One entry per ecosystem, its directories in one
# `directories:` list, so an upstream release opens one PR and not one per
# directory. Every entry runs monthly (the 1st, 02:00 UTC), keeps at most 2
# PRs open, and waits 7 days after a release (cooldown). Lockstep groups come
# first because Dependabot puts a dependency in the FIRST group it matches;
# then one minor-patch group. Majors stay ungrouped, one PR each, so a
# breaking change is read on its own. Security updates ignore the schedule
# and the limit.
#
# Every dtolnay/rust-toolchain step sets `toolchain:`, because the action's
# master requires that input; a grouped bump moves every pin at once.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz
      - /loom-cli
      - /loom-core
      - /loom-isle
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      # One upstream wasm-tools release moves all of these at once.
      wasm-tools-family:
        patterns:
          - "wasmparser"
          - "wasm-encoder"
          - "wasmprinter"
          - "wit-component"
          - "wit-parser"
          - "wasm-metadata"
          - "wat"
      wasmtime:
        patterns:
          - "wasmtime"
          - "wasmtime-*"
      minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # cranelift-isle is pinned to the 0.132.x line in Cargo.toml. Dependabot
      # does not read the comment there, and it re-floated the pin twice
      # (#298, #310), so the pin is defended here. Remove this entry in the
      # same change that moves the pin.
      - dependency-name: cranelift-isle
  - package-ecosystem: docker
    directory: /fuzz/oss-fuzz/projects/loom
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
