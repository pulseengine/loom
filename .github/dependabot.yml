version: 2
# One pull request per ecosystem per week, not one per crate per directory.
#
# Each dependabot PR runs the full CI matrix, and every merge leaves the
# others behind main, so each of them then re-runs the whole matrix again.
# On 2026-11-05 nine bumps were open at once: the wasm-tools family alone
# came as five PRs (wasmprinter and wit-component in / and in /fuzz, plus
# wat in /fuzz) for one upstream release. Grouping turns that into one run.
#
# The trade-off: one bad bump holds the whole group back. When that happens,
# drop it from the group PR and land it on its own.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: cargo
    # Every cargo manifest dependabot watches, in one entry, so the group
    # below spans all of them and a release that touches / and /fuzz arrives
    # as one PR.
    directories:
      - /
      - /fuzz
      - /loom-cli
      - /loom-core
      - /loom-isle
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      cargo:
        patterns:
          - "*"
    ignore:
      # cranelift-isle is PINNED to the 0.132.x line: 0.133+ raises its MSRV to
      # rustc 1.94.0, which is not yet stable, so a wider constraint breaks the
      # wasm32-wasip2 build and reddens main.
      #
      # This entry exists because the pin was re-floated TWICE by automation
      # (#298 → fixed in #304, then #310 again) — both times past a comment in
      # Cargo.toml that explained precisely why not to. Dependabot does not read
      # comments, and these PRs auto-merge, so no human saw the warning either
      # time. A pin defended only by prose is not defended; this makes it
      # mechanical.
      #
      # It used to be repeated in one entry per directory, because #318 was
      # titled "in /fuzz" and re-floated the ROOT workspace pin anyway: every
      # cargo ecosystem needed the entry or the bot found the open door. With
      # all directories in one entry, this single ignore covers all of them.
      #
      # Remove this ignore ONLY when rustc 1.94 is stable on the CI image, or
      # when the lockfile is committed (#320) — and raise the release workflow's
      # asserted glibc ceiling in the same change if the runner image moves.
      - dependency-name: cranelift-isle
  - package-ecosystem: docker
    directory: /fuzz/oss-fuzz/projects/loom
    schedule:
      interval: weekly
    labels:
      - dependencies
