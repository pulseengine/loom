[package]
name = "loom-testing"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["runtime"]
# Enable runtime execution (requires wasmtime, cannot build for wasm targets)
runtime = ["wasmtime", "tempfile", "which", "glob"]

[dependencies]
anyhow = "1.0"
wasmparser = { workspace = true }
wasm-encoder = { workspace = true }
wat = { workspace = true }
rand = "0.10"
loom-core = { path = "../loom-core" }

# Optional runtime dependencies (not available for wasm targets)
# default-features = false + wasmtime 49's full default set MINUS `cache`.
# `cache` (on-disk compiled-module cache) pulls wasmtime-internal-cache ->
# zstd 0.13 / zstd-safe 7 / zstd-sys 2.0, which carry RUSTSEC-2026-0391,
# -0398, -0403, -0410 (and a run of unsound advisories) with no fix
# reachable on the 0.13 line. loom never configures a module cache.
# Keep this list in sync with wasmtime's `default` on every wasmtime bump
# (and with the other wasmtime declaration in loom-core/Cargo.toml).
wasmtime = { version = "49.0", optional = true, default-features = false, features = [
    "anyhow",
    "async",
    "backtrace",
    "gc",
    "gc-copying",
    "gc-drc",
    "gc-null",
    "wat",
    "profiling",
    "parallel-compilation",
    "cranelift",
    "pooling-allocator",
    "demangle",
    "addr2line",
    "coredump",
    "debug-builtins",
    "runtime",
    "component-model",
    "component-model-async",
    "threads",
    "stack-switching",
    "std",
    "debug",
    "compile-time-builtins",
    "wit-parser",
] }
tempfile = { version = "3.8", optional = true }
which = { version = "8.0", optional = true }
glob = { version = "0.3", optional = true }

[dev-dependencies]
criterion = "0.8"

[[bin]]
name = "differential"
path = "src/bin/differential.rs"
required-features = ["runtime"]

[[bin]]
name = "emi"
path = "src/bin/emi.rs"
required-features = ["runtime"]

# Criterion-driven corpus baseline (replaces scripts/measure_corpus.sh as the
# primary entry point; the shell script remains as a fallback).
#
# Run with:
#   cargo bench -p loom-testing --bench corpus_baseline
#
# Smoke test (criterion --test runs each bench once with no measurement):
#   cargo bench -p loom-testing --bench corpus_baseline -- --test
[[bench]]
name = "corpus_baseline"
harness = false
